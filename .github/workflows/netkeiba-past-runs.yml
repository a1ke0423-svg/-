name: netkeiba 過去走の取得（下書き）

# 2つの起動方法:
#  1. 手動（Run workflow で馬IDを入力）
#  2. data/fetch_queue.txt を変更して push → 自動で取得（キューの馬を一括取得）
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "馬ID（カンマ区切り）例: 2022105102,2020100680"
        required: false
        type: string
      out:
        description: "出力先 例: data/past_runs_draft.json"
        required: true
        default: "data/past_runs_draft.json"
        type: string
  push:
    paths:
      - "data/fetch_queue.txt"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 入力を決める（手動 or キュー）
        env:
          EVENT: ${{ github.event_name }}
          MANUAL_IDS: ${{ inputs.ids }}
          MANUAL_OUT: ${{ inputs.out }}
        run: |
          if [ "$EVENT" = "push" ]; then
            IDS=$(grep -E '^[0-9]+$' data/fetch_queue.txt | paste -sd, -)
            OUT="data/past_runs_queue_result.json"
          else
            IDS="$MANUAL_IDS"
            OUT="$MANUAL_OUT"
          fi
          if ! [[ "$IDS" =~ ^[0-9]+(,[0-9]+)*$ ]]; then
            echo "ids は数字とカンマだけにしてください"; exit 1
          fi
          if ! [[ "$OUT" =~ ^data/[A-Za-z0-9_./-]+\.json$ ]]; then
            echo "out は data/ 以下の .json にしてください"; exit 1
          fi
          echo "IDS=$IDS" >> "$GITHUB_ENV"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: 成績を取得して下書きを作る
        run: python3 tools/netkeiba_past_runs.py --ids "$IDS" --out "$OUT" --raw-dir data/raw

      - name: 下書きをリポジトリに保存する（確定はしない）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "netkeiba 過去走の下書きを追加（AI下書き・未確認）: $OUT"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
